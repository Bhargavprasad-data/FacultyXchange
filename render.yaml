services:
  - type: web
    name: faculty-class-exchange
    runtime: node
    plan: free
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
        description: The MongoDB connection string (e.g., from MongoDB Atlas)
      - key: JWT_SECRET
        generateValue: true
        description: A secure random key for signing JWT tokens (automatically generated by Render if not provided)
