services:
  # 1. Backend Web Service
  - type: web
    name: faculty-class-exchange-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true
        description: A secure random key for signing JWT tokens
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
        description: PostgreSQL connection string (provided by Render)
  # 2. Frontend Static Site (with rewrite rules to prevent 404 on refresh)
  - type: web
    name: faculty-class-exchange-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://faculty-class-exchange-backend.onrender.com/api
        description: URL of your backend API service (replace with your actual backend URL once deployed)
      - key: NODE_VERSION
        value: 20

  - type: postgres
    name: faculty-db
    plan: free
    region: oregon
    databaseName: faculty_exchange
